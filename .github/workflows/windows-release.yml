name: Windows Release
permissions:
  contents: write

on:
  push:
    tags:
      # Only matches version tags starting with v; legacy v1.* tags still match, so the real safeguard is pushing a single tag at release time
      - "v[0-9]*"
      - "!*-alpha*"
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs the pnpm version pinned by packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          pnpm install --frozen-lockfile --filter modeltaps-web
          VITE_APP_VERSION=$(git describe --tags) pnpm run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/modeltaps/modeltaps/common/config.Version=$(git describe --tags)'" -o modeltaps.exe
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: modeltaps.exe
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
