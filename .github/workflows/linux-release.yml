name: Linux Release
permissions:
  contents: write

on:
  push:
    tags:
      # Only matches version tags starting with v; legacy v1.* tags still match, so the real safeguard is pushing a single tag at release time
      - "v[0-9]*"
      - "!*-alpha*"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      # Installs the pnpm version pinned by packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          pnpm install --frozen-lockfile --filter modeltaps-web
          VITE_APP_VERSION=$(git describe --tags) pnpm run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/modeltaps/modeltaps/common/config.Version=$(git describe --tags)' -extldflags '-static'" -o modeltaps

      - name: Build Backend (arm64)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/modeltaps/modeltaps/common/config.Version=$(git describe --tags)' -extldflags '-static'" -o modeltaps-arm64

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            modeltaps
            modeltaps-arm64
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
