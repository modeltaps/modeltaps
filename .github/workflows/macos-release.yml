name: macOS Release
permissions:
  contents: write

on:
  push:
    tags:
      # Only matches version tags starting with v; legacy v1.* tags still match, so the real safeguard is pushing a single tag at release time
      - "v[0-9]*"
      - "!*-alpha*"
jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Installs the pnpm version pinned by packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          pnpm install --frozen-lockfile --filter modeltaps-web
          VITE_APP_VERSION=$(git describe --tags) pnpm run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/modeltaps/modeltaps/common/config.Version=$(git describe --tags)'" -o modeltaps-macos
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: modeltaps-macos
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
