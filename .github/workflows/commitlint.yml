name: Commitlint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Only the root package (commitlint + husky) is needed.
      - name: Install commitlint
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile --filter modeltaps-repo-tooling

      # A pull request lints base..head. A push lints before..after; when
      # "before" is all zeros or unknown (first push, new branch, force push)
      # every commit reachable from "after" is linted, including the root.
      - name: Lint commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            commits=$(git rev-list "$PR_BASE..$PR_HEAD")
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qx '0*' \
              && git rev-parse --verify --quiet "$PUSH_BEFORE^{commit}" >/dev/null; then
            commits=$(git rev-list "$PUSH_BEFORE..$PUSH_AFTER")
          else
            commits=$(git rev-list "$PUSH_AFTER")
          fi
          status=0
          for sha in $commits; do
            if ! git log -1 --format=%B "$sha" | pnpm exec commitlint; then
              echo "::error::commit $(git log -1 --oneline "$sha") does not follow the commit message rules"
              status=1
            fi
          done
          exit $status
