<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="One key. Every model." />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="google" content="notranslate" />

    <!-- Icons -->
    <!-- PNG, not SVG: Chromium rasterizes vector icons with 4-sample MSAA, which looks jagged at 16 px -->
    <link rel="icon" href="/brand/favicon-16.png?v=11" sizes="16x16" type="image/png" data-theme-icon="16" />
    <link rel="icon" href="/brand/favicon-32.png?v=11" sizes="32x32" type="image/png" data-theme-icon="32" />
    <link rel="icon" href="/brand/favicon-48.png?v=11" sizes="48x48" type="image/png" data-theme-icon="48" />
    <script>
      // Black mark on light browser chrome, white mark on dark.
      (function () {
        var q = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          document.querySelectorAll('link[data-theme-icon]').forEach(function (l) {
            var s = l.getAttribute('data-theme-icon');
            l.href = '/brand/favicon-' + s + (q.matches ? '-white' : '') + '.png?v=11';
          });
        }
        apply();
        q.addEventListener('change', apply);
      })();
    </script>
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=11" />
    <link rel="manifest" href="/manifest.webmanifest?v=11" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Modeltaps" />
    <meta property="og:description" content="One key. Every model." />
    <meta property="og:image" content="/brand/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Modeltaps" />
    <meta name="twitter:description" content="One key. Every model." />
    <meta name="twitter:image" content="/brand/og-image.png" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
