# Modeltaps 配置文件示例
# 复制为 config.yaml 后按需修改，或通过环境变量覆盖（环境变量优先级更高）。
# 环境变量命名：键全大写、层级用下划线连接，例如 logs.filename -> LOGS_FILENAME。
# 秘密项（<...> 占位符）请务必替换为强随机值，切勿提交真实密钥。

# ---------- 服务器 ----------
port: "3000"                 # 监听端口
gin_mode: "release"          # Gin 运行模式：release / debug
https: false                 # 是否以 HTTPS 对外（影响 cookie Secure 等）
trusted_header: ""           # 获取真实客户端 IP 的头，如 CF-Connecting-IP；仅当请求来自 trusted_proxies 才采信
trusted_proxies: []          # 反向代理的 IP/CIDR 列表，如 ["173.245.48.0/20", "127.0.0.1"]；为空表示不信任任何代理
frontend_base_url: ""        # 设置后页面请求重定向到该地址（仅从服务器设置）
shutdown_timeout: 30         # 优雅关闭超时（秒）
pprof_enabled: false         # 是否开启 pprof 性能分析
favicon: ""                  # 自定义 favicon 路径
github_proxy: ""             # GitHub 资源代理前缀
node_type: "master"          # 节点类型：master / slave

# ---------- 密钥（生产必填，建议 openssl rand -base64 32 生成）----------
session_secret: "<change-me-to-a-random-string>"        # 会话签名密钥，为空则每次启动随机
user_token_secret: "<change-me-to-a-32-char-random-string>"  # 用户令牌签名密钥，必填且 >32 位，勿改
hashids_salt: ""             # Sqids 字母表/盐，用于混淆用户令牌信息，可空

# ---------- 数据库 ----------
sql_dsn: ""                  # 设置后使用 MySQL/PostgreSQL；为空则用 SQLite
#   MySQL:      root:123456@tcp(localhost:3306)/modeltaps
#   PostgreSQL: postgres://postgres:123456@localhost:5432/modeltaps
sqlite_path: "modeltaps.db"     # SQLite 数据库文件路径
sqlite_busy_timeout: 3000    # SQLite 锁等待超时（毫秒）
SQL_MAX_IDLE_CONNS: 100      # 最大空闲连接数
SQL_MAX_OPEN_CONNS: 1000     # 最大打开连接数
SQL_MAX_LIFETIME: 60         # 连接最大生命周期（分钟）

# ---------- Redis ----------
redis_conn_string: ""        # 设置后启用 Redis 缓存，如 redis://default:pw@localhost:6379/0
redis_db: 0                  # Redis DB 序号（redis_conn_string 未含 DB 时生效）
redis_pool_size: 100         # 连接池大小
redis_min_idle_conns: 10     # 最小空闲连接数
redis_pool_timeout: 5        # 连接池等待超时（秒）
redis_read_timeout: 2        # 读超时（秒）
redis_write_timeout: 2       # 写超时（秒）

# ---------- 缓存 / 同步 ----------
memory_cache_enabled: false  # 内存缓存（会导致额度更新有延迟）
sync_frequency: 600          # 启用缓存时与数据库同步频率（秒）
batch_update_enabled: false  # 数据库批量更新聚合（额度更新有延迟）
batch_update_interval: 5     # 批量更新聚合时间间隔（秒）

# ---------- 渠道 ----------
channel:
  update_frequency: 0        # 定期更新渠道余额（分钟），0 表示不更新
  test_frequency: 0          # 定期检查渠道（分钟），0 表示不检查
polling_interval: 0          # 批量更新/测试渠道时的请求间隔（秒）

# ---------- 限流 ----------
global:
  api_rate_limit: 300        # 全局 API 速率限制（单 IP 三分钟内最大请求数，中继除外）
  web_rate_limit: 300        # 全局 Web 速率限制（单 IP 三分钟内最大请求数）

# ---------- 登录安全 ----------
login:
  max_failures: 5            # 同一账号连续登录失败次数上限（跨来源 IP 统计），达到后进入锁定
  lockout_minutes: 15        # 账号锁定时长（分钟），窗口从最近一次失败起算
turnstile_session_minutes: 10  # 会话内 Turnstile 校验结果的有效期（分钟）
session:
  idle_days: 7               # 登录会话空闲多少天没有请求即失效
  max_days: 30               # 登录会话最长有效天数（无论是否活跃），也是会话 cookie 的上限

# ---------- HTTP 客户端 / 中继超时 ----------
connect_timeout: 5           # 连接超时（秒）
relay_timeout: 600           # 中继整体超时（秒）
relay_request_timeout: 300   # 中继单次请求超时（秒）
response_header_timeout: 120 # 响应头超时（秒）
tls_handshake_timeout: 30    # TLS 握手超时（秒）
tls_insecure_skip_verify: false  # 跳过 TLS 证书校验（不安全，慎用）
max_conns_per_host: 0        # 每主机最大连接数，0 表示不限制
max_idle_conns: 1000         # 最大空闲连接数
max_idle_conns_per_host: 200 # 每主机最大空闲连接数

# ---------- 词元编码器 ----------
disable_token_encoders: false  # 禁用本地 token 编码器（改用估算）

# ---------- 价格 / 计费（modeltaps 自研）----------
auto_price_updates: false        # 启动时自动补全缺失的默认模型价格
auto_price_updates_mode: "system"  # 价格更新模式：add / overwrite / update / system
auto_price_updates_interval: 1440  # 价格自动更新周期（分钟），仅 add/overwrite 生效
update_price_service: ""         # 自定义价格服务地址，空则用系统默认
catalog_pricing:
  url: ""                        # 模型目录价格同步源地址
  auto_sync: true                # 是否自动同步目录价格
channel_pricing:
  auto_sync: true                # 是否自动同步渠道价格
unpriced_model_policy: "block"   # 未定价模型策略：block / 其它按默认倍率
unpriced_model_default_ratio: 30.0  # 未定价模型默认倍率
model_drift:
  auto_check: false              # 是否自动检测模型漂移（含上游新增模型检出与通知）
  check_interval: ""             # 检测周期（Go duration，如 1h / 30m）；默认留空即每日 03:30，非法值同样回退
model_info_consistency:
  auto_check: false              # 是否每日自动校验「硬编码生图名单 vs model_info 输出模态」一致性并通知管理员（默认关，每日 03:45）
routing:
  model_info_mode: false         # 是否用 model_info.mode 判定模型任务类型（默认关，只走硬编码名单）；打开后 mode 非空以库中值为准，为空回落名单
catalog:
  enforce_hidden: true           # 是否让管理员隐藏生效（默认开）：有启用渠道可路由即可见，被隐藏的模型不进公开列表、relay 返回 404；关闭为应急回滚，隐藏不再生效；未设置时沿用旧键 enforce_published

# ---------- 账单 ----------
user_invoice_month: false    # 用户月度账单（每月 1 日凌晨生成，消耗资源，慎开）

# ---------- 日志 ----------
log_dir: "./logs"            # 日志目录
log_level: "info"            # 日志级别，debug 输出更详细
logs:
  filename: "modeltaps.log"     # 日志文件名
  max_size: 100              # 单文件最大体积（MB）
  max_age: 7                 # 保留天数
  max_backup: 10             # 最大备份文件数
  compress: false            # 是否压缩历史日志

# ---------- 监控指标（/metrics Basic Auth）----------
metrics:
  user: ""                   # 指标接口用户名，空则不启用鉴权
  password: ""               # 指标接口密码

# ---------- MCP ----------
mcp:
  enable: false              # 是否启用 MCP

# ---------- Uptime Kuma 状态页 ----------
uptime_kuma:
  enable: false              # 是否启用状态页集成
  domain: ""                 # Uptime Kuma 域名
  status_page_name: ""       # 状态页名称

# ---------- Telegram 机器人 ----------
tg:
  bot_api_key: ""            # Telegram bot API 密钥（BotFather 获取）
  webhook_secret: ""         # webhook 密钥，设置则用 webhook，否则轮询
  http_proxy: ""             # 访问 Telegram 的 HTTP/SOCKS5 代理

# ---------- 通知渠道 ----------
notify:
  email:
    disable: false           # 禁用邮件通知
    smtp_to: ""              # 通知收件邮箱
  wecom:
    disable: false           # 禁用企业微信通知
    webhook: ""             # 企业微信机器人 webhook
  dingtalk:
    token: ""               # 钉钉机器人 access token
    secret: ""              # 钉钉加签 secret
    keyWord: ""             # 钉钉关键词
  lark:
    token: ""               # 飞书机器人 token
    secret: ""              # 飞书加签 secret
    keyWord: ""             # 飞书关键词
  pushdeer:
    pushkey: ""             # PushDeer pushkey
    url: ""                 # 自建 PushDeer 地址
  telegram:
    bot_api_key: ""         # 通知用 Telegram bot 密钥
    chat_id: ""             # 通知目标 chat id
    http_proxy: ""          # 代理地址

# ---------- 对象存储（图床）----------
storage:
  alioss:
    endpoint: ""            # 阿里云 OSS endpoint
    accessKeyId: ""         # AccessKeyId
    accessKeySecret: ""     # AccessKeySecret
    bucketName: ""          # bucket 名称
  s3:
    endpoint: ""            # S3 兼容 endpoint
    accessKeyId: ""         # AccessKeyId
    accessKeySecret: ""     # AccessKeySecret
    bucketName: ""          # bucket 名称
    cdnurl: ""              # CDN 访问地址
    expirationDays: 0       # 对象过期天数，0 表示不过期
  smms:
    secret: ""             # SM.MS API secret
  imgur:
    client_id: ""          # Imgur client id

# ---------- 联网搜索 ----------
search:
  searxng:
    url: ""                # SearXNG 实例地址
  tavily:
    key: ""                # Tavily API key
